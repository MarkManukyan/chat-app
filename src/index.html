<!DOCTYPE html>
<html>
<head>
  <title>Чат на WebSocket</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="nickname-modal" class="modal">
      <div class="modal-content">
        <h3>Введите никнейм</h3>
        <input type="text" id="nickname-input" placeholder="Ваш никнейм">
        <button id="join-btn">Присоединиться</button>
        <p id="error-message" class="error"></p>
      </div>
    </div>

    <div id="chat-container" class="hidden">
      <div class="sidebar">
        <h4>Пользователи онлайн</h4>
        <ul id="users-list"></ul>
      </div>
      <div class="chat-area">
        <div id="messages-container"></div>
        <div class="message-input">
          <input type="text" id="message-input" placeholder="Введите сообщение...">
          <button id="send-btn">Отправить</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
